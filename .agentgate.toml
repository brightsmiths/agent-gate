# .agentgate.toml — Enforced boundaries and quality gates for AI coding agents
#
# This file is the single source of truth for:
#   - Mode definitions (which agent can write where)
#   - Quality check pipeline (what must pass before a commit is accepted)
#   - Stub detection patterns (what constitutes an incomplete implementation)
#
# Read by:
#   - Claude Code PreToolUse hooks (soft enforcement, path restrictions)
#   - Git pre-commit hooks (commit quality gating)
#   - agentgate binary (future hard enforcement via Docker bind mounts)
#
# Committed to version control. Changes affect all agents immediately.

[project]
name = "offaxis-firmware"
language = "rust"

# ─────────────────────────────────────────────────────────────────────
# MODES — define which paths each agent role can read/write
# ─────────────────────────────────────────────────────────────────────

[modes.tester]
description = "Writes failing tests from specs. Cannot see or modify implementation."
writable = ["tests"]
readonly = ["src", "lib"]
# What the tester agent reads as input
reads_from = ["docs/spec", "docs/spec/interfaces", "docs/spec/assertions.md"]
# What the tester agent produces
writes_to = ["tests"]
# Claude Code agent file
claude_agent = ".claude/agents/tester.md"
# Copilot agent file
copilot_agent = ".github/agents/tester.agent.md"

[modes.coder]
description = "Implements code to make tests pass. Cannot modify tests."
writable = ["src", "lib"]
readonly = ["tests"]
# What the coder agent reads as input
reads_from = ["docs/spec", "docs/spec/interfaces", "tests", ".llm/tasks.md"]
# What the coder agent produces
writes_to = ["src", "lib"]
# Claude Code agent file
claude_agent = ".claude/agents/coder.md"
# Copilot agent file
copilot_agent = ".github/agents/coder.agent.md"

# ─────────────────────────────────────────────────────────────────────
# CHECKS — quality gate pipeline, executed in sequence
# ─────────────────────────────────────────────────────────────────────

[checks]
# Pipeline order. First failure stops the chain (fail-fast).
sequence = ["paths", "formatting", "no-stubs", "clippy", "tests"]
# Set to false to run all checks and report all failures at once
fail_fast = true
# Maximum lines of output per check (prevents flooding agent context)
max_output_lines = 30

[checks.paths]
# Built-in check: validates all proposed/staged files fall within the
# active mode's writable paths. Always runs first.
type = "builtin"

[checks.formatting]
type = "command"
command = "cargo fmt --check"
# Shown to the agent on failure
remediation = "Run 'cargo fmt' to fix formatting, then try again."

[checks.no-stubs]
type = "pattern-scan"
# Patterns that indicate incomplete implementation
patterns = [
    "todo!()",
    "unimplemented!()",
    'panic!("not implemented")',
    "// TODO",
    "// FIXME",
    "// HACK",
    "// XXX",
]
# Only scan these file extensions
extensions = [".rs"]
# Shown to the agent on failure
remediation = "Replace all stub markers with actual implementations before committing."

[checks.clippy]
type = "command"
command = "cargo clippy -- -D warnings"
remediation = "Fix all clippy warnings before committing."

[checks.tests]
type = "command"
command = "cargo test"
# Timeout in seconds for the full test suite
timeout = 120
remediation = "All tests must pass before committing. Fix failing tests."

# ─────────────────────────────────────────────────────────────────────
# COMMIT — rules for how commits are created
# ─────────────────────────────────────────────────────────────────────

[commit]
# Commit message must follow conventional commits
format = "conventional"
# Minimum commit message length (subject line)
min_message_length = 15
# Suffix appended to all agent-authored commits
agent_suffix = "(auto via agent)"
