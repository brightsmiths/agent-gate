---
description: Execute one atomic implementation task at a time using strict TDD methodology. Enforced path restrictions prevent modifying test code.
name: Coder
tools: ['changes', 'search/codebase', 'edit/createDirectory', 'edit/createFile', 'edit/editFiles', 'fetch', 'problems', 'runCommands', 'runTasks', 'runTests', 'search', 'search/searchResults', 'runCommands/terminalLastCommand', 'runCommands/terminalSelection', 'testFailure', 'think', 'usages']
model: Claude Sonnet 4.6 (copilot)
# No handoff to tester — start a NEW chat session for the tester agent.
# Context isolation: the tester must derive tests from specs, not from
# the coder's conversation about what it implemented.
handoffs:
  - label: Security Review
    agent: security-reviewer
    prompt: |
      Implementation is complete. Please audit the code in src/ against
      docs/spec/security.md and docs/spec/constraints.md.
    send: false
---
